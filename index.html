<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0B0F19;
            --bg-secondary: #111827;
            --bg-tertiary: #182032;
            --content-bg: #0F1623;
            --border: #2A364F;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent: #6366F1;
            --accent-hover: #4F46E5;
            --accent-light: #818CF8;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --purple: #8B5CF6;
            --folder-yellow: #FCD34D;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; overflow: hidden; }
        
        /* Login */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-primary); }
        .login-box { background: var(--bg-secondary); padding: 50px; border-radius: 16px; text-align: center; max-width: 420px; width: 100%; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .login-box h1 { color: var(--accent); margin-bottom: 10px; font-size: 28px; }
        .login-box p { color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }
        .google-btn { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s; }
        .google-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
        
        /* App layout */
        .app-container { display: none; height: 100vh; flex-direction: column; }
        .app-container.active { display: flex; }
        .header { background: var(--bg-primary); padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), var(--purple)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; }
        .logo h1 { font-size: 20px; color: var(--text-primary); font-weight: 700; }
        .logo h1 span { color: var(--accent-light); }
        .private-badge { display: inline-block; padding: 3px 10px; background: var(--success); color: white; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 10px; vertical-align: middle; }
        .user-info { display: flex; align-items: center; gap: 14px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .user-name { color: var(--text-primary); font-size: 13px; font-weight: 500; }
        .logout-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.3s; }
        .logout-btn:hover { color: var(--danger); border-color: var(--danger); }
        
        /* Main content */
        .main-content { display: grid; grid-template-columns: 280px 1fr; flex: 1; overflow: hidden; }
        
        /* ====== SIDEBAR (Cột 1) - Thiết kế mới ====== */
        .sidebar { 
            background: var(--bg-primary); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            height: 100%;
        }
        
        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-header h3 {
            font-size: 14px;
            color: var(--folder-yellow);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3::before {
            content: '📁';
            font-size: 16px;
        }
        .add-root-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .add-root-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        .folder-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
        }
        
        .folder-item {
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-primary);
            transition: all 0.2s;
            margin-bottom: 3px;
            position: relative;
            border: 1px solid transparent;
        }
        .folder-item:hover {
            background: var(--bg-secondary);
            border-color: var(--border);
        }
        .folder-item.active {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }
        
        .folder-toggle {
            width: 16px;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .folder-toggle:hover {
            color: var(--accent-light);
            transform: scale(1.2);
        }
        .folder-item.active .folder-toggle {
            color: rgba(255,255,255,0.8);
        }
        
        .folder-icon {
            flex-shrink: 0;
            font-size: 14px;
        }
        
        .folder-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        
        .folder-count {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0;
            min-width: 22px;
            text-align: center;
            font-weight: 600;
        }
        .folder-item.active .folder-count {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        /* Subfolder levels */
        .folder-item.sub-level-1 {
            padding-left: 28px;
        }
        .folder-item.sub-level-1 .folder-name::before {
            content: '└─ ';
            color: var(--text-muted);
            font-size: 11px;
        }
        .folder-item.sub-level-2 {
            padding-left: 46px;
        }
        .folder-item.sub-level-2 .folder-name::before {
            content: '· └─ ';
            color: var(--text-muted);
            font-size: 11px;
        }
        .folder-item.sub-level-3 {
            padding-left: 64px;
        }
        .folder-item.sub-level-3 .folder-name::before {
            content: '· · └─ ';
            color: var(--text-muted);
            font-size: 11px;
        }
        
        .folder-actions {
            display: none;
            gap: 3px;
            flex-shrink: 0;
        }
        .folder-item:hover .folder-actions {
            display: flex;
        }
        .folder-action {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .folder-action:hover {
            background: rgba(255,255,255,0.15);
        }
        .add-subfolder-btn {
            background: rgba(99,102,241,0.2);
            color: var(--accent-light);
            border: none;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .add-subfolder-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        /* Sidebar footer */
        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            background: var(--bg-primary);
        }
        .sidebar-footer-btn {
            flex: 1;
            padding: 9px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .sidebar-footer-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
            background: var(--content-bg);
        }
        
        /* Content area */
        .content { 
            background: var(--bg-tertiary); 
            padding: 30px; 
            overflow-y: auto;
        }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(99,102,241,0.3); }
        .stat-value { font-size: 36px; font-weight: 700; margin-bottom: 5px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .toolbar { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { width: 100%; padding: 12px 15px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-box input::placeholder { color: var(--text-muted); }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .link-card { background: var(--bg-secondary); border-radius: 12px; padding: 20px; border: 1px solid var(--border); transition: all 0.3s; }
        .link-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .link-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
        .link-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .link-folder { display: inline-block; padding: 4px 12px; background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .link-description { background: var(--bg-primary); padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; border-left: 3px solid var(--accent); font-style: italic; }
        .link-actions { display: flex; gap: 8px; }
        .icon-btn { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.3s; }
        .icon-btn.edit { background: var(--warning); color: white; }
        .icon-btn.delete { background: var(--danger); color: white; }
        .icon-btn:hover { transform: scale(1.1); }
        .audio-embed { background: var(--bg-primary); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
        .audio-embed audio { width: 100%; height: 40px; }
        .audio-embed iframe { width: 100%; border: none; border-radius: 6px; }
        .audio-embed .youtube-embed { height: 200px; }
        .audio-embed .vocaroo-embed { height: 60px; }
        .audio-embed .soundcloud-embed { height: 166px; }
        .embed-hint { font-size: 11px; color: var(--success); margin-top: 6px; font-weight: 600; }
        .link-url { background: var(--bg-primary); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; border: 1px solid var(--border); word-break: break-all; }
        .link-url a { color: var(--accent-light); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .link-url a:hover { text-decoration: underline; }
        .download-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.3s; margin-top: 8px; }
        .download-btn:hover { background: #059669; transform: translateY(-2px); }
        .link-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag { padding: 4px 10px; background: var(--bg-primary); border: 1px solid var(--accent); color: var(--accent-light); border-radius: 15px; font-size: 12px; }
        .link-date { font-size: 12px; color: var(--text-muted); }
        .subfolder-card { background: var(--bg-secondary); border-radius: 12px; padding: 25px; border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; text-align: center; }
        .subfolder-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(99,102,241,0.2); }
        .subfolder-icon { font-size: 48px; margin-bottom: 12px; }
        .subfolder-name { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .subfolder-count { font-size: 13px; color: var(--text-secondary); }
        .subfolder-count span { color: var(--accent-light); font-weight: 600; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 14px; padding: 26px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: var(--accent-light); font-size: 18px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .close-btn:hover { color: var(--danger); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-primary); font-size: 12px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 13px; font-family: inherit; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-modal { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s; }
        .btn-modal-primary { background: var(--accent); color: white; }
        .btn-modal-primary:hover { background: var(--accent-hover); }
        .btn-modal-secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-modal-secondary:hover { border-color: var(--accent); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1/-1; }
        .empty-state-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        @media (max-width: 968px) { .main-content { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🔗 Links Manager</h1>
            <p>Quản lý link âm thanh cá nhân của bạn</p>
            <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: var(--success); border: 1px solid var(--success);">
                🔒 Dữ liệu riêng tư - Chỉ bạn mới xem được
            </div>
            <button class="google-btn" id="googleLoginBtn">🔐 Đăng nhập bằng Google</button>
        </div>
    </div>

    <div id="appContainer" class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🔗</div>
                <h1>Links <span>Manager</span> <span class="private-badge">PRIVATE</span></h1>
            </div>
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                <span id="userName" class="user-name"></span>
                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>
        </header>

        <div class="main-content">
            <!-- SIDEBAR MỚI -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Thư mục</h3>
                    <button class="add-root-btn" id="addFolderBtn">+ Gốc</button>
                </div>
                <div class="folder-tree" id="folderTree"></div>
                <div class="sidebar-footer">
                    <button class="sidebar-footer-btn" id="importBtn">📥 Nhập JSON</button>
                    <button class="sidebar-footer-btn" id="exportBtn">📤 Xuất JSON</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display:none">
            </aside>

            <main class="content">
                <div class="stats">
                    <div class="stat-card"><div class="stat-value" id="totalLinks">0</div><div class="stat-label">Tổng số links</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalFolders">0</div><div class="stat-label">Thư mục</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalTags">0</div><div class="stat-label">Tags</div></div>
                </div>

                <div class="toolbar">
                    <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên, URL, mô tả hoặc tag..."></div>
                    <button class="btn btn-primary" id="addLinkBtn">+ Thêm link</button>
                </div>

                <div id="linksContainer" class="links-grid"></div>
            </main>
        </div>
    </div>

    <div id="linkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="linkModalTitle">Thêm link mới</h2>
                <button class="close-btn" id="closeLinkModal">&times;</button>
            </div>
            <form id="linkForm">
                <input type="hidden" id="linkId">
                <div class="form-group"><label>Tên link *</label><input type="text" id="linkName" required placeholder="Ví dụ: Bài giảng toán"></div>
                <div class="form-group"><label>URL *</label><input type="url" id="linkUrl" required placeholder="https://voca.ro/... hoặc https://youtube.com/..."></div>
                <div class="form-group"><label>Mô tả link</label><textarea id="linkDescription" placeholder="Mô tả ngắn về nội dung link này"></textarea></div>
                <div class="form-group"><label>Thư mục *</label><select id="linkFolder" required></select></div>
                <div class="form-group"><label>Tags (phân cách bằng dấu phẩy)</label><input type="text" id="linkTags" placeholder="toán, calculus, bài giảng"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal btn-modal-secondary" id="cancelLinkBtn">Hủy</button>
                    <button type="submit" class="btn-modal btn-modal-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div id="folderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="folderModalTitle">Thêm thư mục mới</h2>
                <button class="close-btn" id="closeFolderModal">&times;</button>
            </div>
            <form id="folderForm">
                <input type="hidden" id="folderId">
                <div class="form-group"><label>Tên thư mục *</label><input type="text" id="folderName" required placeholder="Ví dụ: Toán học"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal btn-modal-secondary" id="cancelFolderBtn">Hủy</button>
                    <button type="submit" class="btn-modal btn-modal-primary" id="folderSubmitBtn">Tạo</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVBGxTsyvKR0ha0s4_Syk-b7ZXt-rOBps",
            authDomain: "voicelinks.firebaseapp.com",
            projectId: "voicelinks",
            storageBucket: "voicelinks.firebasestorage.app",
            messagingSenderId: "389020652364",
            appId: "1:389020652364:web:7b61ee54343855c75bf5e9",
            measurementId: "G-76EEQ4WB5G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentFolder = 'all';
        let links = [];
        let folders = [];
        let collapsedFolders = new Set();

        const $ = id => document.getElementById(id);

        function getAvatarUrl(user) {
            if (user.photoURL) return user.photoURL;
            const name = user.displayName || user.email || 'User';
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366F1&color=fff&size=128`;
        }

        function getUserPath() { return ['users', currentUser.uid]; }

        function detectLinkType(url) {
            if (!url) return { type: 'unknown', embed: null, downloadUrl: null, hint: null };
            const vocarooMatch = url.match(/voca\.ro\/([a-zA-Z0-9]+)/);
            if (vocarooMatch) {
                const id = vocarooMatch[1];
                return { type: 'vocaroo', embed: `<iframe class="vocaroo-embed" src="https://vocaroo.com/embed/${id}?autoplay=0" allow="autoplay"></iframe>`, downloadUrl: `https://media.vocaroo.com/mp3/${id}`, hint: '🎙️ Vocaroo Player' };
            }
            const youtubeMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (youtubeMatch) {
                const id = youtubeMatch[1];
                return { type: 'youtube', embed: `<iframe class="youtube-embed" src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`, downloadUrl: null, hint: '📺 YouTube Player' };
            }
            if (url.includes('soundcloud.com')) {
                return { type: 'soundcloud', embed: `<iframe class="soundcloud-embed" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%236366F1&inverse=false&auto_play=false&show_user=true"></iframe>`, downloadUrl: null, hint: '🎵 SoundCloud Player' };
            }
            const audioMatch = url.match(/\.(mp3|wav|ogg|m4a|aac)(\?|$)/i);
            if (audioMatch) {
                return { type: 'audio', embed: `<audio controls src="${url}"></audio>`, downloadUrl: url, hint: '🎧 Audio Player' };
            }
            return { type: 'unknown', embed: null, downloadUrl: url, hint: null };
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                $('loginScreen').style.display = 'none';
                $('appContainer').classList.add('active');
                $('userAvatar').src = getAvatarUrl(user);
                $('userAvatar').onerror = function() { this.src = 'https://ui-avatars.com/api/?name=User&background=6366F1&color=fff'; };
                $('userName').textContent = user.displayName || user.email;
                loadData();
            } else {
                currentUser = null;
                $('loginScreen').style.display = 'flex';
                $('appContainer').classList.remove('active');
            }
        });

        $('googleLoginBtn').addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert('Lỗi đăng nhập: ' + error.message); }
        });

        $('logoutBtn').addEventListener('click', async () => {
            try { await signOut(auth); } catch (error) { alert('Lỗi: ' + error.message); }
        });

        async function loadData() {
            if (!currentUser) return;
            try {
                const foldersSnap = await getDocs(collection(db, ...getUserPath(), 'folders'));
                folders = foldersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (folders.length === 0) {
                    await setDoc(doc(db, ...getUserPath(), 'folders', 'default'), { name: 'Chưa phân loại', createdAt: new Date().toISOString() });
                    folders = [{ id: 'default', name: 'Chưa phân loại' }];
                }
                const linksSnap = await getDocs(collection(db, ...getUserPath(), 'links'));
                links = linksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderFolders();
                renderLinks();
                updateStats();
            } catch (error) { alert('Lỗi tải dữ liệu: ' + error.message); }
        }

        function buildFolderTree() {
            const map = new Map();
            folders.forEach(f => map.set(f.id, { ...f, children: [] }));
            const roots = [];
            map.forEach(f => {
                if (f.parentId && map.has(f.parentId)) map.get(f.parentId).children.push(f);
                else roots.push(f);
            });
            return roots;
        }

        function countPromptsInFolder(folderId, includeChildren = true) {
            let count = links.filter(l => l.folder === folderId).length;
            if (includeChildren) {
                folders.filter(f => f.parentId === folderId).forEach(child => {
                    count += countPromptsInFolder(child.id, true);
                });
            }
            return count;
        }

        function getChildren(folderId) {
            return folders.filter(f => f.parentId === folderId);
        }

        // ====== HÀM RENDER FOLDERS MỚI ======
        function renderFolders() {
            const roots = buildFolderTree();
            let html = `
                <div class="folder-item ${currentFolder === 'all' ? 'active' : ''}" data-folder="all">
                    <span class="folder-toggle" style="visibility:hidden;">·</span>
                    <span class="folder-icon">📋</span>
                    <span class="folder-name">Tất cả</span>
                    <span class="folder-count">${links.length}</span>
                </div>
            `;

            function render(list, level = 0) {
                let out = '';
                list.forEach(f => {
                    const count = countPromptsInFolder(f.id);
                    const hasChildren = f.children && f.children.length > 0;
                    const isCollapsed = collapsedFolders.has(f.id);
                    const toggleIcon = hasChildren ? (isCollapsed ? '▶' : '▼') : '·';
                    const subClass = level > 0 ? `sub-level-${Math.min(level, 3)}` : '';
                    
                    out += `
                        <div class="folder-item ${currentFolder === f.id ? 'active' : ''} ${subClass}" data-folder="${f.id}">
                            <span class="folder-toggle" data-toggle="${f.id}">${toggleIcon}</span>
                            <span class="folder-icon">📁</span>
                            <span class="folder-name">${f.name}</span>
                            <span class="folder-count">${count}</span>
                            <div class="folder-actions">
                                <button class="add-subfolder-btn" data-parent-id="${f.id}" title="Thêm thư mục con">➕</button>
                                <button class="folder-action" data-action="edit" data-id="${f.id}" title="Sửa">✏️</button>
                                <button class="folder-action" data-action="delete" data-id="${f.id}" title="Xóa">🗑️</button>
                            </div>
                        </div>
                    `;
                    if (hasChildren && !isCollapsed) {
                        out += render(f.children, level + 1);
                    }
                });
                return out;
            }

            html += render(roots);
            $('folderTree').innerHTML = html;

            // Event: click folder item
            document.querySelectorAll('.folder-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.folder-actions')) return;
                    if (e.target.classList.contains('folder-toggle')) return;
                    currentFolder = item.dataset.folder;
                    renderFolders();
                    renderLinks();
                });
            });

            // Event: click toggle
            document.querySelectorAll('.folder-toggle[data-toggle]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const folderId = btn.dataset.toggle;
                    if (collapsedFolders.has(folderId)) collapsedFolders.delete(folderId);
                    else collapsedFolders.add(folderId);
                    renderFolders();
                });
            });

            // Event: folder actions
            document.querySelectorAll('.folder-action').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const id = btn.dataset.id;
                    if (action === 'edit') editFolder(id);
                    else if (action === 'delete') deleteFolder(id);
                });
            });

            document.querySelectorAll('.add-subfolder-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addSubFolder(btn.dataset.parentId);
                });
            });

            // Update folder select in form
            function renderFolderOptions(folderList, level = 0) {
                let out = '';
                folderList.forEach(f => {
                    out += `<option value="${f.id}">${'— '.repeat(level)}${f.name}</option>`;
                    if (f.children && f.children.length > 0) out += renderFolderOptions(f.children, level + 1);
                });
                return out;
            }
            $('linkFolder').innerHTML = `<option value="">-- Chọn thư mục --</option>` + renderFolderOptions(roots, 0);
        }

        function addSubFolder(parentId) {
            const parent = folders.find(f => f.id === parentId);
            if (!parent) return;
            $('folderModalTitle').textContent = `+ Con của "${parent.name}"`;
            $('folderSubmitBtn').textContent = 'Tạo';
            $('folderId').value = '';
            $('folderName').value = '';
            $('folderName').dataset.parentId = parentId;
            $('folderModal').classList.add('active');
        }

        function editFolder(id) {
            const f = folders.find(x => x.id === id);
            if (!f) return;
            $('folderModalTitle').textContent = 'Sửa tên thư mục';
            $('folderSubmitBtn').textContent = 'Cập nhật';
            $('folderId').value = f.id;
            $('folderName').value = f.name;
            if (f.parentId) $('folderName').dataset.parentId = f.parentId;
            else delete $('folderName').dataset.parentId;
            $('folderModal').classList.add('active');
        }

        async function deleteFolder(id) {
            const f = folders.find(x => x.id === id);
            if (!f) return;
            function descendants(pid) {
                const ch = folders.filter(x => x.parentId === pid);
                let all = [...ch];
                ch.forEach(c => all = all.concat(descendants(c.id)));
                return all;
            }
            const desc = descendants(id);
            const allF = [f, ...desc];
            const ids = allF.map(x => x.id);
            const linkedLinks = links.filter(l => ids.includes(l.folder));
            let msg = `Xóa "${f.name}"?`;
            if (desc.length) msg += `\n\n📂 Bao gồm ${desc.length} thư mục con`;
            if (linkedLinks.length) msg += `\n⚠️ Xóa luôn ${linkedLinks.length} link`;
            if (!confirm(msg)) return;
            try {
                for (const l of linkedLinks) await deleteDoc(doc(db, ...getUserPath(), 'links', l.id));
                for (const x of allF.reverse()) await deleteDoc(doc(db, ...getUserPath(), 'folders', x.id));
                if (ids.includes(currentFolder)) currentFolder = 'all';
                await loadData();
            } catch (e) { alert('Lỗi: ' + e.message); }
        }

        $('addFolderBtn').addEventListener('click', () => {
            $('folderModalTitle').textContent = 'Thêm thư mục gốc';
            $('folderSubmitBtn').textContent = 'Tạo';
            $('folderForm').reset();
            $('folderId').value = '';
            delete $('folderName').dataset.parentId;
            $('folderModal').classList.add('active');
        });

        $('closeFolderModal').addEventListener('click', () => $('folderModal').classList.remove('active'));
        $('cancelFolderBtn').addEventListener('click', () => $('folderModal').classList.remove('active'));

        $('folderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = $('folderId').value;
            const name = $('folderName').value.trim();
            const parentId = $('folderName').dataset.parentId || null;
            try {
                if (id) {
                    const data = { name, updatedAt: new Date().toISOString(), parentId };
                    await setDoc(doc(db, ...getUserPath(), 'folders', id), data, { merge: true });
                } else {
                    const data = { name, createdAt: new Date().toISOString() };
                    if (parentId) data.parentId = parentId;
                    await setDoc(doc(db, ...getUserPath(), 'folders', Date.now().toString()), data);
                }
                $('folderModal').classList.remove('active');
                delete $('folderName').dataset.parentId;
                await loadData();
            } catch (e) { alert('Lỗi: ' + e.message); }
        });

        function renderLinks() {
            const searchTerm = $('searchInput').value.toLowerCase();
            if (currentFolder !== 'all') {
                const children = getChildren(currentFolder);
                if (children.length > 0) {
                    $('linksContainer').innerHTML = children.map(child => {
                        const linkCount = links.filter(l => l.folder === child.id).length;
                        const subCount = getChildren(child.id).length;
                        return `
                            <div class="subfolder-card" data-folder="${child.id}">
                                <div class="subfolder-icon">📁</div>
                                <div class="subfolder-name">${child.name}</div>
                                <div class="subfolder-count"><span>${linkCount}</span> links · <span>${subCount}</span> thư mục con</div>
                            </div>
                        `;
                    }).join('');
                    document.querySelectorAll('.subfolder-card').forEach(card => {
                        card.addEventListener('click', () => {
                            currentFolder = card.dataset.folder;
                            renderFolders();
                            renderLinks();
                        });
                    });
                    return;
                }
            }
            let filtered = links;
            if (currentFolder !== 'all') filtered = filtered.filter(l => l.folder === currentFolder);
            if (searchTerm) {
                filtered = filtered.filter(l => 
                    l.name.toLowerCase().includes(searchTerm) ||
                    (l.url && l.url.toLowerCase().includes(searchTerm)) ||
                    (l.description && l.description.toLowerCase().includes(searchTerm)) ||
                    (l.tags && l.tags.some(t => t.toLowerCase().includes(searchTerm)))
                );
            }
            if (filtered.length === 0) {
                $('linksContainer').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>Không có link nào</h3><p>Thêm link đầu tiên của bạn!</p></div>`;
                return;
            }
            $('linksContainer').innerHTML = filtered.map(link => {
                const folder = folders.find(f => f.id === link.folder);
                const date = new Date(link.createdAt).toLocaleDateString('vi-VN');
                const tags = link.tags ? link.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                const linkInfo = detectLinkType(link.url);
                let embedSection = linkInfo.embed ? `<div class="audio-embed">${linkInfo.embed}${linkInfo.hint ? `<div class="embed-hint">${linkInfo.hint}</div>` : ''}</div>` : '';
                let downloadSection = linkInfo.downloadUrl ? `<a href="${linkInfo.downloadUrl}" download target="_blank" class="download-btn">⬇️ Tải về</a>` : '';
                let descriptionSection = link.description ? `<div class="link-description">💬 ${link.description}</div>` : '';
                return `
                    <div class="link-card">
                        <div class="link-header">
                            <div>
                                <div class="link-title">${link.name}</div>
                                <span class="link-folder">${folder ? folder.name : 'Unknown'}</span>
                            </div>
                            <div class="link-actions">
                                <button class="icon-btn edit" data-action="edit" data-id="${link.id}" title="Sửa">✏️</button>
                                <button class="icon-btn delete" data-action="delete" data-id="${link.id}" title="Xóa">🗑️</button>
                            </div>
                        </div>
                        ${descriptionSection}
                        ${embedSection}
                        <div class="link-url"><a href="${link.url}" target="_blank" rel="noopener noreferrer">🌐 ${link.url}</a></div>
                        ${downloadSection}
                        <div class="link-tags">${tags}</div>
                        <div class="link-date">📅 ${date}</div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('[data-action="edit"]').forEach(btn => btn.addEventListener('click', () => editLink(btn.dataset.id)));
            document.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', () => deleteLink(btn.dataset.id)));
        }

        function updateStats() {
            $('totalLinks').textContent = links.length;
            $('totalFolders').textContent = folders.length;
            const allTags = new Set();
            links.forEach(l => { if (l.tags) l.tags.forEach(t => allTags.add(t)); });
            $('totalTags').textContent = allTags.size;
        }

        $('addLinkBtn').addEventListener('click', () => {
            $('linkModalTitle').textContent = 'Thêm link mới';
            $('linkForm').reset();
            $('linkId').value = '';
            $('linkModal').classList.add('active');
        });
        $('closeLinkModal').addEventListener('click', () => $('linkModal').classList.remove('active'));
        $('cancelLinkBtn').addEventListener('click', () => $('linkModal').classList.remove('active'));

        function editLink(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            $('linkModalTitle').textContent = 'Chỉnh sửa link';
            $('linkId').value = link.id;
            $('linkName').value = link.name;
            $('linkUrl').value = link.url || '';
            $('linkDescription').value = link.description || '';
            $('linkFolder').value = link.folder;
            $('linkTags').value = link.tags ? link.tags.join(', ') : '';
            $('linkModal').classList.add('active');
        }

        async function deleteLink(id) {
            if (!confirm('Xóa link này?')) return;
            try { await deleteDoc(doc(db, ...getUserPath(), 'links', id)); await loadData(); } 
            catch (error) { alert('Lỗi: ' + error.message); }
        }

        $('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = $('linkId').value;
            const linkData = {
                name: $('linkName').value.trim(),
                url: $('linkUrl').value.trim(),
                description: $('linkDescription').value.trim(),
                folder: $('linkFolder').value,
                tags: $('linkTags').value.split(',').map(t => t.trim()).filter(t => t),
                updatedAt: new Date().toISOString()
            };
            try {
                if (id) {
                    const existing = links.find(l => l.id === id);
                    linkData.createdAt = existing.createdAt;
                    await setDoc(doc(db, ...getUserPath(), 'links', id), linkData);
                } else {
                    linkData.createdAt = new Date().toISOString();
                    await setDoc(doc(db, ...getUserPath(), 'links', Date.now().toString()), linkData);
                }
                $('linkModal').classList.remove('active');
                await loadData();
            } catch (error) { alert('Lỗi: ' + error.message); }
        });

        $('searchInput').addEventListener('input', renderLinks);

        $('exportBtn').addEventListener('click', () => {
            const data = { version: '6.0-newsidebar', exportedAt: new Date().toISOString(), folders, links };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `links-manager-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        $('importBtn').addEventListener('click', () => $('importFile').click());

        $('importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (!data.folders || !data.links) throw new Error('File không hợp lệ');
                for (const f of data.folders) {
                    await setDoc(doc(db, ...getUserPath(), 'folders', f.id || Date.now().toString()), {
                        name: f.name, parentId: f.parentId || null, createdAt: f.createdAt || new Date().toISOString()
                    });
                }
                for (const l of data.links) {
                    await setDoc(doc(db, ...getUserPath(), 'links', l.id || Date.now().toString()), {
                        name: l.name, url: l.url, description: l.description || '',
                        folder: l.folder, tags: l.tags || [],
                        createdAt: l.createdAt || new Date().toISOString(),
                        updatedAt: l.updatedAt || new Date().toISOString()
                    });
                }
                alert('Nhập dữ liệu thành công!');
                await loadData();
            } catch (error) { alert('Lỗi: ' + error.message); }
            $('importFile').value = '';
        });

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) e.target.classList.remove('active');
        });
    </script>
</body>
</html>
