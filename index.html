<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --border: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --accent: #38BDF8;
            --accent-hover: #0EA5E9;
            --danger: #F87171;
            --danger-hover: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
            --purple: #8B5CF6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); }
        .login-box { background: var(--bg-secondary); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; max-width: 450px; width: 100%; border: 1px solid var(--border); }
        .login-box h1 { color: var(--accent); margin-bottom: 10px; font-size: 32px; }
        .login-box p { color: var(--text-secondary); margin-bottom: 30px; }
        .google-btn { background: var(--accent); color: var(--bg-primary); border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s; }
        .google-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }
        .app-container { display: none; min-height: 100vh; }
        .header { background: var(--bg-secondary); padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--accent), var(--purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        .logo h1 { font-size: 24px; color: var(--text-primary); }
        .logo h1 span { color: var(--accent); }
        .private-badge { display: inline-block; padding: 3px 10px; background: var(--success); color: white; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 10px; vertical-align: middle; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .user-name { color: var(--text-primary); font-weight: 500; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .logout-btn:hover { background: var(--danger-hover); }
        .main-content { display: grid; grid-template-columns: 300px 1fr; gap: 30px; padding: 30px 40px; max-width: 1600px; margin: 0 auto; }
        .sidebar { background: var(--bg-secondary); border-radius: 15px; padding: 25px; border: 1px solid var(--border); height: fit-content; position: sticky; top: 100px; max-height: calc(100vh - 120px); overflow-y: auto; }
        .sidebar h2 { color: var(--accent); margin-bottom: 20px; font-size: 18px; }
        .folder-list { list-style: none; margin-bottom: 20px; }
        .folder-item { padding: 10px 12px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary); transition: all 0.3s; border: 1px solid transparent; }
        .folder-item:hover { border-color: var(--border); transform: translateX(3px); }
        .folder-item.active { background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; border-color: var(--accent); }
        .folder-name { flex: 1; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; }
        .folder-actions { display: flex; gap: 4px; opacity: 0; transition: all 0.3s; }
        .folder-item:hover .folder-actions { opacity: 1; }
        .folder-action-btn { background: rgba(255,255,255,0.1); border: none; cursor: pointer; font-size: 11px; padding: 3px 8px; border-radius: 5px; transition: all 0.3s; font-weight: 600; color: inherit; }
        .folder-action-btn.edit-btn:hover { background: var(--warning); color: white; }
        .folder-action-btn.delete-btn:hover { background: var(--danger); color: white; }
        .add-subfolder-btn { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: none; cursor: pointer; font-size: 11px; padding: 3px 8px; border-radius: 5px; transition: all 0.3s; font-weight: 600; }
        .add-subfolder-btn:hover { background: var(--accent); color: var(--bg-primary); }
        .folder-item.sub-level-1 { padding-left: 25px; }
        .folder-item.sub-level-2 { padding-left: 45px; }
        .folder-item.sub-level-3 { padding-left: 65px; }
        .add-folder-btn { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .add-folder-btn:hover { background: #059669; }
        .content { background: var(--bg-secondary); border-radius: 15px; padding: 30px; border: 1px solid var(--border); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); }
        .stat-value { font-size: 36px; font-weight: 700; margin-bottom: 5px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .toolbar { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { width: 100%; padding: 12px 15px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 14px; }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-box input::placeholder { color: var(--text-secondary); }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: var(--accent); color: var(--bg-primary); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-secondary { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .link-card { background: var(--bg-primary); border-radius: 12px; padding: 20px; border: 1px solid var(--border); transition: all 0.3s; }
        .link-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); }
        .link-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
        .link-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .link-folder { display: inline-block; padding: 4px 12px; background: linear-gradient(135deg, var(--accent), var(--purple)); color: white; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .link-description { background: var(--bg-secondary); padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; border-left: 3px solid var(--accent); font-style: italic; }
        .link-actions { display: flex; gap: 8px; }
        .icon-btn { width: 32px; height: 32px; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.3s; }
        .icon-btn.edit { background: var(--warning); color: white; }
        .icon-btn.delete { background: var(--danger); color: white; }
        .icon-btn:hover { transform: scale(1.1); }
        .audio-embed { background: var(--bg-secondary); border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); }
        .audio-embed audio { width: 100%; height: 40px; }
        .audio-embed iframe { width: 100%; border: none; border-radius: 6px; }
        .audio-embed .youtube-embed { height: 200px; }
        .audio-embed .vocaroo-embed { height: 60px; }
        .audio-embed .soundcloud-embed { height: 166px; }
        .embed-hint { font-size: 11px; color: var(--success); margin-top: 6px; font-weight: 600; }
        .link-url { background: var(--bg-secondary); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; border: 1px solid var(--border); word-break: break-all; }
        .link-url a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .link-url a:hover { text-decoration: underline; }
        .download-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.3s; margin-top: 8px; }
        .download-btn:hover { background: #059669; transform: translateY(-2px); }
        .link-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag { padding: 4px 10px; background: var(--bg-secondary); border: 1px solid var(--accent); color: var(--accent); border-radius: 15px; font-size: 12px; }
        .link-date { font-size: 12px; color: var(--text-secondary); }
        
        /* Sub-folder cards in main content */
        .subfolder-card { background: var(--bg-primary); border-radius: 12px; padding: 25px; border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; text-align: center; }
        .subfolder-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); }
        .subfolder-icon { font-size: 48px; margin-bottom: 12px; }
        .subfolder-name { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .subfolder-count { font-size: 13px; color: var(--text-secondary); }
        .subfolder-count span { color: var(--accent); font-weight: 600; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-header h2 { color: var(--accent); }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--text-secondary); }
        .close-btn:hover { color: var(--danger); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-secondary); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); grid-column: 1/-1; }
        .empty-state-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
        @media (max-width: 968px) { .main-content { grid-template-columns: 1fr; } .sidebar { position: static; } }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🔗 Links Manager</h1>
            <p>Quản lý link âm thanh cá nhân của bạn</p>
            <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: var(--success); border: 1px solid var(--success);">
                🔒 Dữ liệu riêng tư - Chỉ bạn mới xem được
            </div>
            <button class="google-btn" id="googleLoginBtn">🔐 Đăng nhập bằng Google</button>
        </div>
    </div>

    <div id="appContainer" class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🔗</div>
                <h1>Links <span>Manager</span> <span class="private-badge">PRIVATE</span></h1>
            </div>
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                <span id="userName" class="user-name"></span>
                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <h2>📁 Thư mục</h2>
                <ul id="folderList" class="folder-list"></ul>
                <button class="add-folder-btn" id="addFolderBtn">+ Thêm thư mục gốc</button>
            </aside>

            <main class="content">
                <div class="stats">
                    <div class="stat-card"><div class="stat-value" id="totalLinks">0</div><div class="stat-label">Tổng số links</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalFolders">0</div><div class="stat-label">Thư mục</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalTags">0</div><div class="stat-label">Tags</div></div>
                </div>

                <div class="toolbar">
                    <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên, URL, mô tả hoặc tag..."></div>
                    <button class="btn btn-primary" id="addLinkBtn">+ Thêm link</button>
                    <button class="btn btn-success" id="exportBtn">💾 Xuất JSON</button>
                    <button class="btn btn-secondary" id="importBtn">📂 Nhập JSON</button>
                    <input type="file" id="importFile" accept=".json" style="display:none">
                </div>

                <div id="linksContainer" class="links-grid"></div>
            </main>
        </div>
    </div>

    <div id="linkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="linkModalTitle">Thêm link mới</h2>
                <button class="close-btn" id="closeLinkModal">&times;</button>
            </div>
            <form id="linkForm">
                <input type="hidden" id="linkId">
                <div class="form-group"><label>Tên link *</label><input type="text" id="linkName" required placeholder="Ví dụ: Bài giảng toán"></div>
                <div class="form-group"><label>URL *</label><input type="url" id="linkUrl" required placeholder="https://voca.ro/... hoặc https://youtube.com/..."></div>
                <div class="form-group"><label>Mô tả link</label><textarea id="linkDescription" placeholder="Mô tả ngắn về nội dung link này"></textarea></div>
                <div class="form-group"><label>Thư mục *</label><select id="linkFolder" required></select></div>
                <div class="form-group"><label>Tags (phân cách bằng dấu phẩy)</label><input type="text" id="linkTags" placeholder="toán, calculus, bài giảng"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelLinkBtn">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div id="folderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="folderModalTitle">Thêm thư mục mới</h2>
                <button class="close-btn" id="closeFolderModal">&times;</button>
            </div>
            <form id="folderForm">
                <input type="hidden" id="folderId">
                <div class="form-group"><label>Tên thư mục *</label><input type="text" id="folderName" required placeholder="Ví dụ: Toán học"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelFolderBtn">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="folderSubmitBtn">Tạo</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVBGxTsyvKR0ha0s4_Syk-b7ZXt-rOBps",
            authDomain: "voicelinks.firebaseapp.com",
            projectId: "voicelinks",
            storageBucket: "voicelinks.firebasestorage.app",
            messagingSenderId: "389020652364",
            appId: "1:389020652364:web:7b61ee54343855c75bf5e9",
            measurementId: "G-76EEQ4WB5G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentFolder = 'all';
        let links = [];
        let folders = [];

        const $ = id => document.getElementById(id);

        function getAvatarUrl(user) {
            if (user.photoURL) return user.photoURL;
            const name = user.displayName || user.email || 'User';
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=38BDF8&color=0F172A&size=128`;
        }

        function getUserPath() {
            return ['users', currentUser.uid];
        }

        function detectLinkType(url) {
            if (!url) return { type: 'unknown', embed: null, downloadUrl: null, hint: null };
            
            const vocarooMatch = url.match(/voca\.ro\/([a-zA-Z0-9]+)/);
            if (vocarooMatch) {
                const id = vocarooMatch[1];
                return {
                    type: 'vocaroo',
                    embed: `<iframe class="vocaroo-embed" src="https://vocaroo.com/embed/${id}?autoplay=0" allow="autoplay"></iframe>`,
                    downloadUrl: `https://media.vocaroo.com/mp3/${id}`,
                    hint: '🎙️ Vocaroo Player'
                };
            }
            
            const youtubeMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (youtubeMatch) {
                const id = youtubeMatch[1];
                return {
                    type: 'youtube',
                    embed: `<iframe class="youtube-embed" src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`,
                    downloadUrl: null,
                    hint: '📺 YouTube Player'
                };
            }
            
            if (url.includes('soundcloud.com')) {
                return {
                    type: 'soundcloud',
                    embed: `<iframe class="soundcloud-embed" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%2338BDF8&inverse=false&auto_play=false&show_user=true"></iframe>`,
                    downloadUrl: null,
                    hint: '🎵 SoundCloud Player'
                };
            }
            
            const audioMatch = url.match(/\.(mp3|wav|ogg|m4a|aac)(\?|$)/i);
            if (audioMatch) {
                return {
                    type: 'audio',
                    embed: `<audio controls src="${url}"></audio>`,
                    downloadUrl: url,
                    hint: '🎧 Audio Player'
                };
            }
            
            return { type: 'unknown', embed: null, downloadUrl: url, hint: null };
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                $('loginScreen').style.display = 'none';
                $('appContainer').style.display = 'block';
                $('userAvatar').src = getAvatarUrl(user);
                $('userAvatar').onerror = function() {
                    this.src = 'https://ui-avatars.com/api/?name=User&background=38BDF8&color=0F172A';
                };
                $('userName').textContent = user.displayName || user.email;
                loadData();
            } else {
                currentUser = null;
                $('loginScreen').style.display = 'flex';
                $('appContainer').style.display = 'none';
            }
        });

        $('googleLoginBtn').addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert('Lỗi đăng nhập: ' + error.message); console.error(error); }
        });

        $('logoutBtn').addEventListener('click', async () => {
            try { await signOut(auth); } 
            catch (error) { alert('Lỗi đăng xuất: ' + error.message); }
        });

        async function loadData() {
            if (!currentUser) return;
            try {
                const foldersSnap = await getDocs(collection(db, ...getUserPath(), 'folders'));
                folders = foldersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                if (folders.length === 0) {
                    await setDoc(doc(db, ...getUserPath(), 'folders', 'default'), {
                        name: 'Chưa phân loại', 
                        createdAt: new Date().toISOString()
                    });
                    folders = [{ id: 'default', name: 'Chưa phân loại' }];
                }

                const linksSnap = await getDocs(collection(db, ...getUserPath(), 'links'));
                links = linksSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                renderFolders();
                renderLinks();
                updateStats();
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
                alert('Lỗi tải dữ liệu: ' + error.message);
            }
        }

        function buildFolderTree() {
            const folderMap = new Map();
            folders.forEach(f => folderMap.set(f.id, { ...f, children: [] }));
            const rootFolders = [];

            folderMap.forEach((folder, id) => {
                if (folder.parentId && folderMap.has(folder.parentId)) {
                    folderMap.get(folder.parentId).children.push(folder);
                } else {
                    rootFolders.push(folder);
                }
            });

            return rootFolders;
        }

        function getChildren(folderId) {
            return folders.filter(f => f.parentId === folderId);
        }

        function renderFolders() {
            const rootFolders = buildFolderTree();

            function renderFolderList(folderList, level = 0) {
                let html = '';
                folderList.forEach(folder => {
                    const linkCount = links.filter(l => l.folder === folder.id).length;
                    const subClass = level > 0 ? `sub-level-${Math.min(level, 3)}` : '';
                    const indent = level > 0 ? '└─ ' : '';
                    
                    html += `
                        <li class="folder-item ${currentFolder === folder.id ? 'active' : ''} ${subClass}" data-folder="${folder.id}">
                            <span class="folder-name">${indent}📁 ${folder.name} (${linkCount})</span>
                            <div class="folder-actions">
                                <button class="add-subfolder-btn" data-parent-id="${folder.id}" title="Thêm thư mục con">➕ Con</button>
                                <button class="folder-action-btn edit-btn" data-folder-id="${folder.id}" title="Sửa">✏️</button>
                                <button class="folder-action-btn delete-btn" data-folder-id="${folder.id}" title="Xóa">🗑️</button>
                            </div>
                        </li>
                    `;
                    
                    if (folder.children.length > 0) {
                        html += renderFolderList(folder.children, level + 1);
                    }
                });
                return html;
            }

            $('folderList').innerHTML = `
                <li class="folder-item ${currentFolder === 'all' ? 'active' : ''}" data-folder="all">
                    <span class="folder-name">📋 Tất cả</span>
                </li>
            ` + renderFolderList(rootFolders, 0);

            function renderFolderOptions(folderList, level = 0) {
                let html = '';
                folderList.forEach(folder => {
                    const indent = '— '.repeat(level);
                    html += `<option value="${folder.id}">${indent}${folder.name}</option>`;
                    if (folder.children.length > 0) {
                        html += renderFolderOptions(folder.children, level + 1);
                    }
                });
                return html;
            }

            $('linkFolder').innerHTML = `<option value="">-- Chọn thư mục --</option>` + 
                renderFolderOptions(rootFolders, 0);

            document.querySelectorAll('.folder-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.folder-actions')) return;
                    currentFolder = item.dataset.folder;
                    renderFolders();
                    renderLinks();
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    editFolder(btn.dataset.folderId); 
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    deleteFolder(btn.dataset.folderId); 
                });
            });

            document.querySelectorAll('.add-subfolder-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    addSubFolder(btn.dataset.parentId); 
                });
            });
        }

        function addSubFolder(parentId) {
            const parentFolder = folders.find(f => f.id === parentId);
            if (!parentFolder) return;
            
            $('folderModalTitle').textContent = `Thêm thư mục con của "${parentFolder.name}"`;
            $('folderSubmitBtn').textContent = 'Tạo';
            $('folderId').value = '';
            $('folderName').value = '';
            $('folderName').dataset.parentId = parentId;
            $('folderModal').classList.add('active');
        }

        async function deleteFolder(folderId) {
            const folder = folders.find(f => f.id === folderId);
            if (!folder) return;
            
            function findAllDescendants(parentId) {
                const children = folders.filter(f => f.parentId === parentId);
                let allDescendants = [...children];
                children.forEach(child => {
                    allDescendants = allDescendants.concat(findAllDescendants(child.id));
                });
                return allDescendants;
            }
            
            const allDescendants = findAllDescendants(folderId);
            const allFoldersToDelete = [folder, ...allDescendants];
            const foldersToDeleteIds = allFoldersToDelete.map(f => f.id);
            const linksToDelete = links.filter(l => foldersToDeleteIds.includes(l.folder));
            
            let msg = `Xóa thư mục "${folder.name}"?`;
            if (allDescendants.length > 0) {
                msg += `\n\n📂 Bao gồm ${allDescendants.length} thư mục con:`;
                allDescendants.forEach(d => msg += `\n   - ${d.name}`);
            }
            if (linksToDelete.length > 0) {
                msg += `\n\n⚠️ Sẽ xóa luôn ${linksToDelete.length} link bên trong!`;
            }
            msg += '\n\nKhông thể hoàn tác!';
            
            if (!confirm(msg)) return;
            
            try {
                for (const link of linksToDelete) {
                    await deleteDoc(doc(db, ...getUserPath(), 'links', link.id));
                }
                for (const f of allFoldersToDelete.reverse()) {
                    await deleteDoc(doc(db, ...getUserPath(), 'folders', f.id));
                }
                if (foldersToDeleteIds.includes(currentFolder)) currentFolder = 'all';
                await loadData();
            } catch (error) { 
                alert('Lỗi: ' + error.message); 
            }
        }

        function editFolder(folderId) {
            const folder = folders.find(f => f.id === folderId);
            if (!folder) return;
            $('folderModalTitle').textContent = 'Sửa tên thư mục';
            $('folderSubmitBtn').textContent = 'Cập nhật';
            $('folderId').value = folder.id;
            $('folderName').value = folder.name;
            if (folder.parentId) {
                $('folderName').dataset.parentId = folder.parentId;
            } else {
                delete $('folderName').dataset.parentId;
            }
            $('folderModal').classList.add('active');
        }

        function renderLinks() {
            const searchTerm = $('searchInput').value.toLowerCase();
            
            // Nếu đang ở thư mục cụ thể (không phải 'all')
            if (currentFolder !== 'all') {
                const children = getChildren(currentFolder);
                
                // Nếu có thư mục con → hiển thị thư mục con
                if (children.length > 0) {
                    $('linksContainer').innerHTML = children.map(child => {
                        const linkCount = links.filter(l => l.folder === child.id).length;
                        const subFolderCount = getChildren(child.id).length;
                        
                        return `
                            <div class="subfolder-card" data-folder="${child.id}">
                                <div class="subfolder-icon">📁</div>
                                <div class="subfolder-name">${child.name}</div>
                                <div class="subfolder-count">
                                    <span>${linkCount}</span> links · <span>${subFolderCount}</span> thư mục con
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    // Click vào subfolder card → navigate vào folder đó
                    document.querySelectorAll('.subfolder-card').forEach(card => {
                        card.addEventListener('click', () => {
                            currentFolder = card.dataset.folder;
                            renderFolders();
                            renderLinks();
                        });
                    });
                    
                    return;
                }
            }
            
            // Nếu không có thư mục con → hiển thị links
            let filtered = links;
            if (currentFolder !== 'all') filtered = filtered.filter(l => l.folder === currentFolder);
            if (searchTerm) {
                filtered = filtered.filter(l => 
                    l.name.toLowerCase().includes(searchTerm) ||
                    (l.url && l.url.toLowerCase().includes(searchTerm)) ||
                    (l.description && l.description.toLowerCase().includes(searchTerm)) ||
                    (l.tags && l.tags.some(t => t.toLowerCase().includes(searchTerm)))
                );
            }

            if (filtered.length === 0) {
                $('linksContainer').innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>Không có link nào</h3><p>Thêm link đầu tiên của bạn!</p></div>`;
                return;
            }

            $('linksContainer').innerHTML = filtered.map(link => {
                const folder = folders.find(f => f.id === link.folder);
                const date = new Date(link.createdAt).toLocaleDateString('vi-VN');
                const tags = link.tags ? link.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                const linkInfo = detectLinkType(link.url);
                
                let embedSection = '';
                if (linkInfo.embed) {
                    embedSection = `<div class="audio-embed">${linkInfo.embed}${linkInfo.hint ? `<div class="embed-hint">${linkInfo.hint}</div>` : ''}</div>`;
                }
                
                let downloadSection = '';
                if (linkInfo.downloadUrl) {
                    downloadSection = `<a href="${linkInfo.downloadUrl}" download target="_blank" class="download-btn">⬇️ Tải về</a>`;
                }
                
                let descriptionSection = '';
                if (link.description) descriptionSection = `<div class="link-description">💬 ${link.description}</div>`;

                return `
                    <div class="link-card">
                        <div class="link-header">
                            <div>
                                <div class="link-title">${link.name}</div>
                                <span class="link-folder">${folder ? folder.name : 'Unknown'}</span>
                            </div>
                            <div class="link-actions">
                                <button class="icon-btn edit" data-action="edit" data-id="${link.id}" title="Sửa">✏️</button>
                                <button class="icon-btn delete" data-action="delete" data-id="${link.id}" title="Xóa">🗑️</button>
                            </div>
                        </div>
                        ${descriptionSection}
                        ${embedSection}
                        <div class="link-url"><a href="${link.url}" target="_blank" rel="noopener noreferrer">🌐 ${link.url}</a></div>
                        ${downloadSection}
                        <div class="link-tags">${tags}</div>
                        <div class="link-date">📅 ${date}</div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('[data-action="edit"]').forEach(btn => btn.addEventListener('click', () => editLink(btn.dataset.id)));
            document.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', () => deleteLink(btn.dataset.id)));
        }

        function updateStats() {
            $('totalLinks').textContent = links.length;
            $('totalFolders').textContent = folders.length;
            const allTags = new Set();
            links.forEach(l => { if (l.tags) l.tags.forEach(t => allTags.add(t)); });
            $('totalTags').textContent = allTags.size;
        }

        $('addLinkBtn').addEventListener('click', () => {
            $('linkModalTitle').textContent = 'Thêm link mới';
            $('linkForm').reset();
            $('linkId').value = '';
            $('linkModal').classList.add('active');
        });

        $('closeLinkModal').addEventListener('click', () => $('linkModal').classList.remove('active'));
        $('cancelLinkBtn').addEventListener('click', () => $('linkModal').classList.remove('active'));

        function editLink(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            $('linkModalTitle').textContent = 'Chỉnh sửa link';
            $('linkId').value = link.id;
            $('linkName').value = link.name;
            $('linkUrl').value = link.url || '';
            $('linkDescription').value = link.description || '';
            $('linkFolder').value = link.folder;
            $('linkTags').value = link.tags ? link.tags.join(', ') : '';
            $('linkModal').classList.add('active');
        }

        async function deleteLink(id) {
            if (!confirm('Xóa link này?')) return;
            try { 
                await deleteDoc(doc(db, ...getUserPath(), 'links', id)); 
                await loadData(); 
            } catch (error) { alert('Lỗi: ' + error.message); }
        }

        $('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = $('linkId').value;
            const linkData = {
                name: $('linkName').value.trim(),
                url: $('linkUrl').value.trim(),
                description: $('linkDescription').value.trim(),
                folder: $('linkFolder').value,
                tags: $('linkTags').value.split(',').map(t => t.trim()).filter(t => t),
                updatedAt: new Date().toISOString()
            };
            try {
                if (id) {
                    const existing = links.find(l => l.id === id);
                    linkData.createdAt = existing.createdAt;
                    await setDoc(doc(db, ...getUserPath(), 'links', id), linkData);
                } else {
                    linkData.createdAt = new Date().toISOString();
                    await setDoc(doc(db, ...getUserPath(), 'links', Date.now().toString()), linkData);
                }
                $('linkModal').classList.remove('active');
                await loadData();
            } catch (error) { alert('Lỗi: ' + error.message); }
        });

        $('addFolderBtn').addEventListener('click', () => {
            $('folderModalTitle').textContent = 'Thêm thư mục gốc mới';
            $('folderSubmitBtn').textContent = 'Tạo';
            $('folderForm').reset();
            $('folderId').value = '';
            delete $('folderName').dataset.parentId;
            $('folderModal').classList.add('active');
        });

        $('closeFolderModal').addEventListener('click', () => $('folderModal').classList.remove('active'));
        $('cancelFolderBtn').addEventListener('click', () => $('folderModal').classList.remove('active'));

        $('folderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const folderId = $('folderId').value;
            const name = $('folderName').value.trim();
            const parentId = $('folderName').dataset.parentId || null;
            
            try {
                if (folderId) {
                    const updateData = { name, updatedAt: new Date().toISOString() };
                    if (parentId !== null) updateData.parentId = parentId;
                    else updateData.parentId = null;
                    await setDoc(doc(db, ...getUserPath(), 'folders', folderId), updateData, { merge: true });
                } else {
                    const newFolderData = { 
                        name, 
                        createdAt: new Date().toISOString() 
                    };
                    if (parentId) newFolderData.parentId = parentId;
                    await setDoc(doc(db, ...getUserPath(), 'folders', Date.now().toString()), newFolderData);
                }
                $('folderModal').classList.remove('active');
                $('folderForm').reset();
                delete $('folderName').dataset.parentId;
                await loadData();
            } catch (error) { 
                alert('Lỗi: ' + error.message); 
            }
        });

        $('searchInput').addEventListener('input', renderLinks);

        $('exportBtn').addEventListener('click', () => {
            const data = { version: '5.0-subfolder', exportedAt: new Date().toISOString(), folders, links };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `links-manager-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        $('importBtn').addEventListener('click', () => $('importFile').click());

        $('importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data.version || !data.folders || !data.links) throw new Error('File không hợp lệ');
                for (const folder of data.folders) {
                    await setDoc(doc(db, ...getUserPath(), 'folders', folder.id || Date.now().toString()), {
                        name: folder.name, 
                        parentId: folder.parentId || null,
                        createdAt: folder.createdAt || new Date().toISOString()
                    });
                }
                for (const link of data.links) {
                    await setDoc(doc(db, ...getUserPath(), 'links', link.id || Date.now().toString()), {
                        name: link.name, url: link.url, description: link.description || '',
                        folder: link.folder, tags: link.tags || [],
                        createdAt: link.createdAt || new Date().toISOString(),
                        updatedAt: link.updatedAt || new Date().toISOString()
                    });
                }
                alert('Nhập dữ liệu thành công!');
                await loadData();
            } catch (error) { alert('Lỗi: ' + error.message); }
            $('importFile').value = '';
        });

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) e.target.classList.remove('active');
        });
    </script>
</body>
</html>
